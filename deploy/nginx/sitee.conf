# SITEE edge: TLS 1.3, rate-limit зоны, WS-проксирование (docs/deploy.md §4).
# Монтируется в /etc/nginx/conf.d/default.conf контейнера nginx.

upstream sitee_api {
    least_conn;
    server siteed:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# Зоны лимитов: общий API, аутентификация, админка, WS.
limit_req_zone $binary_remote_addr zone=api:20m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=admin:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=ws:10m   rate=20r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name sitee.example api.sitee.example;

    ssl_certificate     /etc/nginx/tls/sitee.crt;
    ssl_certificate_key /etc/nginx/tls/sitee.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://sitee.example; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    client_max_body_size 8m;
    limit_conn perip 20;
    send_timeout 10s;
    client_body_timeout 10s;

    # Honeypot и сканеры — сразу 444, без логов в приложении.
    location ~* ^/(wp-login\.php|admin\.php|\.env|\.git) {
        access_log off;
        return 444;
    }

    # Статика TMA: index.html + ассеты, кэш на 5 минут, immutable для версий.
    location / {
        root /app/frontend;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
        location ~* \.(?:js|css|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Аутентификация и 2FA — отдельная строгая зона.
    location /api/v1/auth/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://sitee_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/v1/admin/ {
        limit_req zone=admin burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://sitee_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    # WebSocket: апгрейд + долгий таймаут под heartbeat 25 с.
    location /ws {
        limit_req zone=ws burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://sitee_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://sitee_api;
        include /etc/nginx/snippets/proxy.conf;
    }

    location = /healthz {
        proxy_pass http://sitee_api;
        access_log off;
    }
}

server {
    listen 443 ssl;
    server_name admin.sitee.example;
    # Гео-ограничение админки (docs/deploy.md §4): только разрешённые страны.
    # geo $allowed_country { default 0; RU 1; }
    # if ($allowed_country = 0) { return 403; }
    location / {
        proxy_pass http://sitee_api;
        include /etc/nginx/snippets/proxy.conf;
    }
}

server {
    listen 80;
    server_name sitee.example api.sitee.example admin.sitee.example;
    return 301 https://$host$request_uri;
}
