openapi: 3.1.0
info:
  title: SITEE Marketplace API
  version: 1.0.0
  summary: Маркетплейс цифровых товаров с расчётами в SOL и Telegram Stars
  description: |
    Контракт REST API площадки SITEE. WebSocket-контракт описан в `docs/architecture.md` (§5)
    и `docs/api.md` (§10). Все денежные суммы: SOL — строка decimal (9 знаков), Stars — целое.
    Все ответы с ошибками имеют единый формат `Error`. Мутирующие финансовые операции требуют
    заголовок `Idempotency-Key`.
  contact:
    name: SITEE Engineering
servers:
  - url: https://api.sitee.example/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local dev
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: geo
  - name: shops
  - name: rent
  - name: products
  - name: orders
  - name: disputes
  - name: chats
  - name: e2ee
  - name: wallet
  - name: exchange
  - name: gifts
  - name: reviews
  - name: admin

paths:
  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      security: []
      summary: Публичная конфигурация входа (политика паролей, капча, 2FA)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }

  /geo/countries:
    get:
      tags: [geo]
      operationId: listCountries
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Country' }

  /geo/cities:
    get:
      tags: [geo]
      operationId: listCities
      security: []
      parameters:
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/City' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      summary: Регистрация (FR-AUTH-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Создан enrollment, ожидает код подтверждения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-contact:
    post:
      tags: [auth]
      operationId: verifyContact
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id, code]
              properties:
                enrollment_id: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Код принят, следующий шаг — настройка 2FA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '423': { $ref: '#/components/responses/Locked' }

  /auth/2fa/setup:
    post:
      tags: [auth]
      operationId: setup2fa
      summary: Выдать секрет TOTP для фактора (FR-2FA-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor]
              properties:
                factor: { $ref: '#/components/schemas/TotpFactor' }
                enrollment_id: { type: string }
      responses:
        '200':
          description: Секрет и otpauth-URI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetup' }

  /auth/2fa/activate:
    post:
      tags: [auth]
      operationId: activate2fa
      summary: Активация фактора двумя кодами подряд + backup-коды (FR-2FA-02/03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor, code_1, code_2]
              properties:
                factor: { $ref: '#/components/schemas/TotpFactor' }
                enrollment_id: { type: string }
                code_1: { type: string, pattern: '^[0-9]{6}$' }
                code_2: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Фактор активен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [active] }
                  backup_codes:
                    type: array
                    items: { type: string, pattern: '^[A-Z0-9]{5}-[A-Z0-9]{5}$' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Вход (пароль → вызов 2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Требуется фактор 2FA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/verify:
    post:
      tags: [auth]
      operationId: verify2fa
      security: []
      summary: Подтверждение TOTP и выдача токенов (FR-AUTH-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, factor, code]
              properties:
                session_id: { type: string }
                factor: { $ref: '#/components/schemas/TotpFactor' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                backup_code: { type: string }
      responses:
        '200':
          description: Сессия выдана; `redirect` — куда переходит клиент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Новые токены (ротация)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shops:
    get:
      tags: [shops]
      operationId: listShops
      summary: Лента магазинов и поиск (FR-FEED-01…06)
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: integer } }
        - { name: category, in: query, schema: { type: integer } }
        - { name: min_rating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: crown_only, in: query, schema: { type: boolean } }
        - { name: verified_only, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, rating, sales, new, price] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopPage' }
    post:
      tags: [shops]
      operationId: createShop
      summary: Создать магазин (требуется фактор ops и аренда/триал)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopCreate' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopDetail' }
        '403': { $ref: '#/components/responses/TotpRequired' }

  /shops/{id}:
    get:
      tags: [shops]
      operationId: getShop
      security: []
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [shops]
      operationId: updateShop
      summary: Изменение магазина (FR-SHOP-03)
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                accepts_stars: { type: boolean }
                cover_url: { type: string }
                auto_renew: { type: boolean }
      responses:
        '200':
          description: Обновлённый магазин
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /rent/plans:
    get:
      tags: [rent]
      operationId: listRentPlans
      responses:
        '200':
          description: Тарифы аренды
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RentPlan' }

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [buyer, shop] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
    post:
      tags: [orders]
      operationId: createOrder
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/StockEmpty' }

  /orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: Заказ с таймлайном и доступными действиями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /chats:
    get:
      tags: [chats]
      operationId: listChats
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, shops, orders, disputes, channels] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Список диалогов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatListItem' }
    post:
      tags: [chats]
      operationId: openChat
      summary: Открыть диалог (с админом магазина, приватный, группа)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [shop_support, order, dispute, group, channel, direct] }
                shop_id: { type: string }
                order_id: { type: string }
                user_id: { type: string }
                title: { type: string }
      responses:
        '201':
          description: Чат создан или возвращён существующий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatDetail' }

  /wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      responses:
        '200':
          description: Балансы, депозитный адрес, лимиты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }

  /wallet/withdraw:
    post:
      tags: [wallet]
      operationId: withdraw
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, dest_address, totp_code]
              properties:
                asset: { $ref: '#/components/schemas/Asset' }
                amount: { type: string }
                dest_address: { type: string }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '202':
          description: Вывод принят в обработку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '403': { $ref: '#/components/responses/TotpRequired' }

  /exchange/quote:
    get:
      tags: [exchange]
      operationId: getExchangeQuote
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/Asset' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/Asset' } }
        - { name: amount, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Котировка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }

  /exchange:
    post:
      tags: [exchange]
      operationId: executeExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string }
                totp_code: { type: string }
      responses:
        '200':
          description: Обмен исполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeOrder' }

  /gifts:
    get:
      tags: [gifts]
      operationId: listGifts
      parameters:
        - { name: rarity, in: query, schema: { type: string, enum: [common, rare, epic, legendary] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Каталог подарков
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Gift' }

  /admin/gifts:
    get:
      tags: [admin]
      operationId: adminListGifts
      responses:
        '200':
          description: Все подарки включая черновики
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Gift' }
    post:
      tags: [admin]
      operationId: adminCreateGift
      summary: Добавить подарок (FR-STR-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiftAdmin' }
      responses:
        '201':
          description: Подарок создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        '403': { $ref: '#/components/responses/TotpRequired' }

  /admin/dashboard:
    get:
      tags: [admin]
      operationId: adminDashboard
      responses:
        '200':
          description: Сводка площадки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }

  /admin/audit:
    get:
      tags: [admin]
      operationId: adminAudit
      summary: Неизменяемый аудит-лог с хэш-цепочкой
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/categories:
    get:
      tags: [admin]
      operationId: adminListCategories
      summary: "Категории: 18+ и чёрный список юрисдикций"
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/categories/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateCategory
      summary: Изменение гео-блокировок категории
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked_countries, restricted, totp_code, reason]
              properties:
                blocked_countries: { type: array, items: { type: string } }
                restricted: { type: boolean }
                totp_code: { type: string }
                reason: { type: string }
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/disputes:
    get:
      tags: [admin]
      operationId: adminListDisputes
      summary: Очередь споров
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/disputes/{id}/assign:
    post:
      tags: [admin]
      operationId: adminAssignDispute
      summary: Назначение арбитра на спор
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [arbiter_id]
              properties:
                arbiter_id: { type: string }
      responses:
        '201':
          description: Создано
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/finance/reconciliation:
    get:
      tags: [admin]
      operationId: adminReconciliation
      summary: Сверка ledger и Solana
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/gifts/{id}:
    patch:
      tags: [admin]
      operationId: adminUpdateGift
      summary: handleAdminUpdateGift
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [admin]
      operationId: adminArchiveGift
      summary: handleAdminArchiveGift
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/moderation/products:
    get:
      tags: [admin]
      operationId: adminModerationQueue
      summary: Очередь модерации товаров
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/moderation/products/{id}/approve:
    post:
      tags: [admin]
      operationId: adminApproveProduct
      summary: Одобрение товара
      security: [ { bearerAuth: [] } ]
      parameters: [ { $ref: '#/components/parameters/PathId' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
