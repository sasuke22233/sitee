openapi: 3.1.0
info:
  title: SITEE Marketplace API
  version: 1.0.0
  summary: Маркетплейс цифровых товаров с расчётами в SOL и Telegram Stars
  description: |
    Контракт REST API площадки SITEE. WebSocket-контракт описан в `docs/architecture.md` (§5)
    и `docs/api.md` (§10). Все денежные суммы: SOL — строка decimal (9 знаков), Stars — целое.
    Все ответы с ошибками имеют единый формат `Error`. Мутирующие финансовые операции требуют
    заголовок `Idempotency-Key`.
  contact:
    name: SITEE Engineering
servers:
  - url: https://api.sitee.example/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local dev
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: geo
  - name: shops
  - name: rent
  - name: products
  - name: orders
  - name: disputes
  - name: chats
  - name: e2ee
  - name: wallet
  - name: exchange
  - name: gifts
  - name: reviews
  - name: admin

paths:
  /auth/config:
    get:
      tags: [auth]
      operationId: getAuthConfig
      security: []
      summary: Публичная конфигурация входа (политика паролей, капча, 2FA)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }

  /geo/countries:
    get:
      tags: [geo]
      operationId: listCountries
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Country' }

  /geo/cities:
    get:
      tags: [geo]
      operationId: listCities
      security: []
      parameters:
        - { name: country, in: query, schema: { type: string, minLength: 2, maxLength: 2 } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/City' }

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      summary: Регистрация (FR-AUTH-02)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Создан enrollment, ожидает код подтверждения
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { $ref: '#/components/responses/ConflictError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify-contact:
    post:
      tags: [auth]
      operationId: verifyContact
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id, code]
              properties:
                enrollment_id: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Код принят, следующий шаг — настройка 2FA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '423': { $ref: '#/components/responses/Locked' }

  /auth/2fa/setup:
    post:
      tags: [auth]
      operationId: setup2fa
      summary: Выдать секрет TOTP для фактора (FR-2FA-02)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor]
              properties:
                factor: { $ref: '#/components/schemas/TotpFactor' }
                enrollment_id: { type: string }
      responses:
        '200':
          description: Секрет и otpauth-URI
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TotpSetup' }

  /auth/2fa/activate:
    post:
      tags: [auth]
      operationId: activate2fa
      summary: Активация фактора двумя кодами подряд + backup-коды (FR-2FA-02/03)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor, code_1, code_2]
              properties:
                factor: { $ref: '#/components/schemas/TotpFactor' }
                enrollment_id: { type: string }
                code_1: { type: string, pattern: '^[0-9]{6}$' }
                code_2: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Фактор активен
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [active] }
                  backup_codes:
                    type: array
                    items: { type: string, pattern: '^[A-Z0-9]{5}-[A-Z0-9]{5}$' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: Вход (пароль → вызов 2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Требуется фактор 2FA
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginChallenge' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/2fa/verify:
    post:
      tags: [auth]
      operationId: verify2fa
      security: []
      summary: Подтверждение TOTP и выдача токенов (FR-AUTH-05)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, factor, code]
              properties:
                session_id: { type: string }
                factor: { $ref: '#/components/schemas/TotpFactor' }
                code: { type: string, pattern: '^[0-9]{6}$' }
                backup_code: { type: string }
      responses:
        '200':
          description: Сессия выдана; `redirect` — куда переходит клиент
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '423': { $ref: '#/components/responses/Locked' }

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        '200':
          description: Новые токены (ротация)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /shops:
    get:
      tags: [shops]
      operationId: listShops
      summary: Лента магазинов и поиск (FR-FEED-01…06)
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 120 } }
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: integer } }
        - { name: category, in: query, schema: { type: integer } }
        - { name: min_rating, in: query, schema: { type: number, minimum: 0, maximum: 5 } }
        - { name: crown_only, in: query, schema: { type: boolean } }
        - { name: verified_only, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [recommended, rating, sales, new, price] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: Страница ленты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopPage' }
    post:
      tags: [shops]
      operationId: createShop
      summary: Создать магазин (требуется фактор ops и аренда/триал)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShopCreate' }
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopDetail' }
        '403': { $ref: '#/components/responses/TotpRequired' }

  /shops/{shopId}:
    get:
      tags: [shops]
      operationId: getShop
      security: []
      parameters: [ { $ref: '#/components/parameters/ShopId' } ]
      responses:
        '200':
          description: Карточка магазина
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShopDetail' }
        '404': { $ref: '#/components/responses/NotFound' }

  /shops/{shopId}/rent:
    get:
      tags: [rent]
      operationId: getShopRent
      parameters: [ { $ref: '#/components/parameters/ShopId' } ]
      responses:
        '200':
          description: Текущая подписка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentSubscription' }
    post:
      tags: [rent]
      operationId: subscribeRent
      summary: Оплата аренды магазина (FR-SHOP-04…06)
      parameters: [ { $ref: '#/components/parameters/ShopId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan_code, asset, totp_code]
              properties:
                plan_code: { type: string, enum: [starter, pro, crown, enterprise] }
                asset: { $ref: '#/components/schemas/Asset' }
                months: { type: integer, minimum: 1, maximum: 12, default: 1 }
                auto_renew: { type: boolean, default: true }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '201':
          description: Аренда оплачена
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentSubscription' }
        '403': { $ref: '#/components/responses/TotpRequired' }
        '422': { $ref: '#/components/responses/InsufficientFunds' }

  /rent/plans:
    get:
      tags: [rent]
      operationId: listRentPlans
      responses:
        '200':
          description: Тарифы аренды
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RentPlan' }

  /shops/{shopId}/products:
    get:
      tags: [products]
      operationId: listProducts
      security: []
      parameters:
        - { $ref: '#/components/parameters/ShopId' }
        - { name: q, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 50 } }
      responses:
        '200':
          description: Витрина товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  next_cursor: { type: [string, 'null'] }
    post:
      tags: [products]
      operationId: createProduct
      parameters: [ { $ref: '#/components/parameters/ShopId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductCreate' }
      responses:
        '201':
          description: Товар создан (статус moderation/published)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }

  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [buyer, shop] } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/OrderStatus' } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
    post:
      tags: [orders]
      operationId: createOrder
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderCreate' }
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422': { $ref: '#/components/responses/StockEmpty' }

  /orders/{orderId}:
    get:
      tags: [orders]
      operationId: getOrder
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: Заказ с таймлайном и доступными действиями
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{orderId}/pay:
    post:
      tags: [orders]
      operationId: payOrder
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset]
              properties:
                asset: { $ref: '#/components/schemas/Asset' }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Оплачено, средства в эскроу
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '403': { $ref: '#/components/responses/TotpRequired' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/InsufficientFunds' }

  /orders/{orderId}/confirm:
    post:
      tags: [orders]
      operationId: confirmOrder
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      responses:
        '200':
          description: Заказ завершён, эскроу раскрыто
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }

  /orders/{orderId}/dispute:
    post:
      tags: [disputes]
      operationId: openDispute
      summary: Открыть спор (FR-DSP-01)
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeCreate' }
      responses:
        '201':
          description: Спор открыт, создан чат с маскировкой
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }

  /disputes/{disputeId}/escalate:
    post:
      tags: [disputes]
      operationId: escalateDispute
      summary: Пригласить админа-арбитра (FR-DSP-04)
      parameters: [ { $ref: '#/components/parameters/DisputeId' } ]
      responses:
        '200':
          description: Спор в арбитраже
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }

  /disputes/{disputeId}/resolve:
    post:
      tags: [disputes]
      operationId: resolveDispute
      summary: Решение арбитра (FR-DSP-05), требует фактор ops
      parameters: [ { $ref: '#/components/parameters/DisputeId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeResolve' }
      responses:
        '200':
          description: Решение исполнено атомарно в ledger
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }

  /chats:
    get:
      tags: [chats]
      operationId: listChats
      parameters:
        - { name: filter, in: query, schema: { type: string, enum: [all, shops, orders, disputes, channels] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Список диалогов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChatListItem' }
    post:
      tags: [chats]
      operationId: openChat
      summary: Открыть диалог (с админом магазина, приватный, группа)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [shop_support, order, dispute, group, channel, direct] }
                shop_id: { type: string }
                order_id: { type: string }
                user_id: { type: string }
                title: { type: string }
      responses:
        '201':
          description: Чат создан или возвращён существующий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatDetail' }

  /chats/{chatId}/messages:
    get:
      tags: [chats]
      operationId: listMessages
      parameters:
        - { $ref: '#/components/parameters/ChatId' }
        - { name: before_seq, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100, default: 50 } }
      responses:
        '200':
          description: История сообщений (тела — ciphertext)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  has_more: { type: boolean }
    post:
      tags: [chats]
      operationId: sendMessage
      parameters: [ { $ref: '#/components/parameters/ChatId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageSend' }
      responses:
        '201':
          description: Сообщение принято (шифруется и рассылается по WS)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

  /wallet:
    get:
      tags: [wallet]
      operationId: getWallet
      responses:
        '200':
          description: Балансы, депозитный адрес, лимиты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }

  /wallet/withdraw:
    post:
      tags: [wallet]
      operationId: withdraw
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [asset, amount, dest_address, totp_code]
              properties:
                asset: { $ref: '#/components/schemas/Asset' }
                amount: { type: string }
                dest_address: { type: string }
                totp_code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '202':
          description: Вывод принят в обработку
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Withdrawal' }
        '403': { $ref: '#/components/responses/TotpRequired' }

  /exchange/quote:
    get:
      tags: [exchange]
      operationId: getExchangeQuote
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/Asset' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/Asset' } }
        - { name: amount, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Котировка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }

  /exchange:
    post:
      tags: [exchange]
      operationId: executeExchange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id: { type: string }
                totp_code: { type: string }
      responses:
        '200':
          description: Обмен исполнен
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeOrder' }

  /gifts:
    get:
      tags: [gifts]
      operationId: listGifts
      parameters:
        - { name: rarity, in: query, schema: { type: string, enum: [common, rare, epic, legendary] } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Каталог подарков
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Gift' }

  /gifts/{giftId}/buy:
    post:
      tags: [gifts]
      operationId: buyGift
      parameters: [ { name: giftId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiftBuy' }
      responses:
        '201':
          description: Подарок куплен и доставлен получателю
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GiftPurchase' }

  /orders/{orderId}/review:
    post:
      tags: [reviews]
      operationId: createReview
      parameters: [ { $ref: '#/components/parameters/OrderId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Отзыв опубликован
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /admin/gifts:
    get:
      tags: [admin]
      operationId: adminListGifts
      responses:
        '200':
          description: Все подарки включая черновики
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Gift' }
    post:
      tags: [admin]
      operationId: adminCreateGift
      summary: Добавить подарок (FR-STR-04)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiftAdmin' }
      responses:
        '201':
          description: Подарок создан
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
        '403': { $ref: '#/components/responses/TotpRequired' }

  /admin/gifts/{giftId}:
    patch:
      tags: [admin]
      operationId: adminUpdateGift
      parameters: [ { name: giftId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GiftAdmin' }
      responses:
        '200':
          description: Обновлено (diff в аудит)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Gift' }
    delete:
      tags: [admin]
      operationId: adminArchiveGift
      parameters: [ { name: giftId, in: path, required: true, schema: { type: string } } ]
      responses:
        '204': { description: Архивирован }

  /admin/dashboard:
    get:
      tags: [admin]
      operationId: adminDashboard
      responses:
        '200':
          description: Сводка площадки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (EdDSA / Ed25519)

  parameters:
    ShopId: { name: shopId, in: path, required: true, schema: { type: string } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
    ChatId: { name: chatId, in: path, required: true, schema: { type: string } }
    DisputeId: { name: disputeId, in: path, required: true, schema: { type: string } }

  responses:
    ValidationError:
      description: Ошибка валидации
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Не аутентифицирован
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Не найдено (или не видно)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConflictError:
      description: Конфликт состояния
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidTransition:
      description: Недопустимый переход статуса
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TotpRequired:
      description: Требуется второй фактор 2FA
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InsufficientFunds:
      description: Недостаточно средств
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StockEmpty:
      description: Нет свободных единиц товара
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Превышен лимит запросов
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Locked:
      description: Аккаунт/IP временно заблокирован (анти-брутфорс)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, status]
          properties:
            code: { type: string, example: TOTP_STEP2_REQUIRED }
            message: { type: string }
            status: { type: integer }
            details: { type: object }
            request_id: { type: string }

    Asset: { type: string, enum: [SOL, STARS, USDC] }
    TotpFactor: { type: string, enum: [login, ops] }

    OrderStatus:
      type: string
      enum: [created, awaiting_payment, paid_escrow, processing, delivered, completed,
             dispute_opened, in_arbitration, refunded, cancelled, expired]

    AuthConfig:
      type: object
      properties:
        password:
          type: object
          properties:
            min_len: { type: integer, example: 12 }
            classes: { type: integer, example: 3 }
            algo: { type: string, example: argon2id }
        captcha:
          type: object
          properties:
            provider: { type: string, example: turnstile }
            site_key: { type: string }
            required_after_fails: { type: integer, example: 3 }
        2fa:
          type: object
          properties:
            factors: { type: array, items: { $ref: '#/components/schemas/TotpFactor' } }
            period: { type: integer, example: 30 }
            digits: { type: integer, example: 6 }
            issuer: { type: string, example: SITEE }
        telegram:
          type: object
          properties:
            bot_username: { type: string }
            init_data_required: { type: boolean }
        features:
          type: object
          properties:
            stars: { type: boolean }
            sol: { type: boolean }
            exchange: { type: boolean }
            gifts: { type: boolean }

    Country:
      type: object
      properties:
        code: { type: string, example: NO }
        name_ru: { type: string, example: Норвегия }
        name_en: { type: string, example: Norway }

    City:
      type: object
      properties:
        id: { type: integer, example: 3110 }
        country: { type: string, example: NO }
        name_ru: { type: string, example: Саннефьорд }
        name_en: { type: string, example: Sandefjord }
        tz: { type: string, example: Europe/Oslo }

    RegisterRequest:
      type: object
      required: [nickname, password, password_confirm, country_code, accept_terms, is_18plus]
      properties:
        email: { type: string, format: email }
        nickname: { type: string, minLength: 3, maxLength: 24, pattern: '^[a-z0-9_]+$' }
        password: { type: string, minLength: 12, maxLength: 128 }
        password_confirm: { type: string }
        country_code: { type: string, example: NO }
        city_id: { type: integer }
        accept_terms: { type: boolean }
        is_18plus: { type: boolean }
        referral_code: { type: [string, 'null'] }
        captcha_token: { type: [string, 'null'] }

    Enrollment:
      type: object
      properties:
        enrollment_id: { type: string }
        status:
          type: string
          enum: [pending_contact_code, pending_2fa_login, pending_2fa_ops, complete]
        expires_at: { type: string, format: date-time }

    TotpSetup:
      type: object
      properties:
        factor: { $ref: '#/components/schemas/TotpFactor' }
        secret_b32: { type: string }
        otpauth_url: { type: string }
        qr_svg: { type: string }
        label: { type: string, example: 'SITEE (вход)' }
        expires_at: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, description: email или nickname }
        password: { type: string }
        captcha_token: { type: [string, 'null'] }
        device:
          type: object
          properties:
            ua: { type: string }
            tz: { type: string }
            fingerprint: { type: string }

    LoginChallenge:
      type: object
      properties:
        session_id: { type: string }
        challenge: { type: string, enum: [totp_login, totp_ops] }
        factor: { $ref: '#/components/schemas/TotpFactor' }
        trusted_device: { type: boolean }
        expires_at: { type: string, format: date-time }

    AuthSession:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, example: 900 }
        user: { $ref: '#/components/schemas/Me' }
        redirect: { type: string, example: /shops }

    Me:
      type: object
      properties:
        id: { type: string }
        nickname: { type: string }
        role:
          type: string
          enum: [buyer, seller, shop_admin, moderator, arbiter, superadmin]
        country: { type: string }
        city_id: { type: integer }
        factors:
          type: object
          properties:
            login: { type: string, enum: [pending, active, revoked] }
            ops: { type: string, enum: [pending, active, revoked] }
        balances:
          type: object
          properties:
            SOL: { type: string }
            STARS: { type: integer }
        unread:
          type: object
          properties:
            chats: { type: integer }
            notifications: { type: integer }

    ShopCard:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        cover_url: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'] }
        rating: { type: number, example: 4.8 }
        rating_count: { type: integer }
        is_crowned: { type: boolean, description: Коронка в углу карточки (FR-SHOP-07) }
        is_verified: { type: boolean }
        country: { type: string }
        city: { type: string }
        sales_count: { type: integer }
        response_p50_s: { type: [integer, 'null'] }
        price_from_sol: { type: [string, 'null'] }
        promoted: { type: boolean }
        rent_status: { type: string, enum: [trial, active, expiring, grace, suspended, none] }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              slug: { type: string }
              name_ru: { type: string }

    ShopPage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShopCard' }
        next_cursor: { type: [string, 'null'] }
        has_more: { type: boolean }

    ShopCreate:
      type: object
      required: [name, slug, description, category_ids, totp_code]
      properties:
        name: { type: string, minLength: 3, maxLength: 40 }
        slug: { type: string, pattern: '^[a-z0-9-]{3,40}$' }
        description: { type: string, maxLength: 2000 }
        category_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 3 }
        country_code: { type: string }
        city_id: { type: integer }
        tz: { type: string }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    ShopDetail:
      allOf:
        - $ref: '#/components/schemas/ShopCard'
        - type: object
          properties:
            description: { type: string }
            admin:
              type: object
              properties:
                nickname: { type: string }
                is_online: { type: boolean }
                response_p50_s: { type: integer }
                visible_as: { type: string, example: 'Админ магазина' }
            stats:
              type: object
              properties:
                dispute_rate: { type: number }
                positive_pct: { type: integer }
            actions:
              type: object
              properties:
                can_chat: { type: boolean }
                can_order: { type: boolean }
                can_gift: { type: boolean }
            products:
              type: array
              items: { $ref: '#/components/schemas/Product' }

    RentPlan:
      type: object
      properties:
        id: { type: string }
        code: { type: string, enum: [starter, pro, crown, enterprise] }
        name_ru: { type: string }
        price_sol: { type: string }
        price_stars: { type: integer }
        product_limit: { type: integer }
        fee_bps: { type: integer, example: 350 }
        feed_boost: { type: number }
        grants_crown: { type: boolean }
        support_sla_h: { type: integer }

    RentSubscription:
      type: object
      properties:
        id: { type: string }
        shop_id: { type: string }
        plan: { type: string }
        status: { type: string, enum: [trial, active, expiring, grace, suspended, cancelled, expired] }
        asset: { $ref: '#/components/schemas/Asset' }
        price: { type: string }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        grace_end: { type: [string, 'null'], format: date-time }
        auto_renew: { type: boolean }
        days_left: { type: integer }
        is_crowned: { type: boolean }

    Product:
      type: object
      properties:
        id: { type: string }
        shop_id: { type: string }
        title: { type: string }
        description: { type: string }
        kind: { type: string, enum: [key, file, account, subscription, service_code, custom] }
        price_sol: { type: string }
        price_stars: { type: integer }
        stock_free: { type: integer }
        warranty_days: { type: integer }
        delivery_sla_h: { type: integer }
        status: { type: string, enum: [draft, moderation, published, rejected, archived] }
        media_urls: { type: array, items: { type: string } }
        rating: { type: number }

    ProductCreate:
      type: object
      required: [title, kind, price_sol]
      properties:
        title: { type: string, maxLength: 120 }
        description: { type: string }
        kind: { type: string }
        category_id: { type: integer }
        price_sol: { type: string }
        price_stars: { type: integer }
        warranty_days: { type: integer }
        delivery_sla_h: { type: integer }
        stock_items: { type: array, items: { type: string }, description: Секреты для автовыдачи (шифруются) }

    OrderCreate:
      type: object
      required: [shop_id, items]
      properties:
        shop_id: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [product_id, qty]
            properties:
              product_id: { type: string }
              qty: { type: integer, minimum: 1 }
        pay_asset: { $ref: '#/components/schemas/Asset' }

    Order:
      type: object
      properties:
        id: { type: string }
        number: { type: string, example: '#A7K2-9931' }
        status: { $ref: '#/components/schemas/OrderStatus' }
        shop:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              qty: { type: integer }
              unit_price_sol: { type: string }
        totals:
          type: object
          properties:
            subtotal_sol: { type: string }
            fee_sol: { type: string }
            total_sol: { type: string }
            asset: { $ref: '#/components/schemas/Asset' }
        pay_deadline: { type: [string, 'null'], format: date-time }
        confirm_deadline: { type: [string, 'null'], format: date-time }
        delivery_kind: { type: string, enum: [auto, manual, file] }
        status_timeline:
          type: array
          items:
            type: object
            properties:
              status: { $ref: '#/components/schemas/OrderStatus' }
              ts: { type: string, format: date-time }
              actor: { type: string }
        actions:
          type: array
          items: { type: string }
          example: [confirm, extend, open_dispute, chat_with_admin]
        chat_id: { type: [string, 'null'] }
        dispute: { type: [object, 'null'] }

    DisputeCreate:
      type: object
      required: [reason_code, description, totp_code]
      properties:
        reason_code:
          type: string
          enum: [not_delivered, broken, not_as_described, fraud, sla_violation, other]
        description: { type: string, minLength: 30, maxLength: 4000 }
        evidence:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              kind: { type: string, enum: [image, video, file, text] }
              upload_id: { type: string }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    DisputeResolve:
      type: object
      required: [resolution, reason, totp_code]
      properties:
        resolution:
          type: string
          enum: [complete, refund_full, refund_partial, replace, dismiss, escalate_senior, sanction]
        amount: { type: string }
        reason: { type: string, minLength: 100 }
        sanction_level: { type: string, enum: [warn, restrict, suspend, ban] }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    Dispute:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        status:
          type: string
          enum: [open, awaiting_reply, in_arbitration, resolved, dismissed, appeal, closed]
        chat_id: { type: string }
        you_are: { type: string, enum: [buyer, shop_admin, arbiter] }
        your_alias: { type: string, example: 'Покупатель #K92' }
        counterparty_alias: { type: string, example: 'Продавец #A17' }
        reveal: { type: boolean, description: true только для арбитра }
        participants:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              visible_as: { type: string }
              role: { type: string }
        reply_deadline: { type: string, format: date-time }
        resolution: { type: [string, 'null'] }
        resolution_amount: { type: [string, 'null'] }
        actions: { type: array, items: { type: string } }

    ChatListItem:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [shop_support, order, dispute, group, channel, direct] }
        title: { type: string }
        shop: { type: [object, 'null'] }
        admin:
          type: object
          properties:
            nickname: { type: string }
            is_online: { type: boolean }
            visible_as: { type: string, example: 'Админ магазина' }
        last_message:
          type: object
          properties:
            preview: { type: string, example: '<encrypted>' }
            ts: { type: string, format: date-time }
            sender: { type: string }
        unread: { type: integer }
        e2ee: { type: boolean }
        pinned: { type: boolean }
        is_muted: { type: boolean }

    ChatDetail:
      allOf:
        - $ref: '#/components/schemas/ChatListItem'
        - type: object
          properties:
            members:
              type: array
              items:
                type: object
                properties:
                  user_id: { type: string }
                  visible_as: { type: string }
                  role: { type: string }
            messages:
              type: array
              items: { $ref: '#/components/schemas/Message' }

    Message:
      type: object
      properties:
        id: { type: string }
        chat_id: { type: string }
        seq: { type: integer }
        sender_id: { type: string }
        sender_visible_as: { type: string }
        type: { type: string, enum: [text, attachment, product_card, order_card, gift_card, system, reply] }
        body_ct: { type: string, description: base64 envelope AES-256-GCM (или E2EE ciphertext) }
        body_plain: { type: [string, 'null'], description: Только для клиента-владельца ключа; сервер не заполняет в E2EE }
        e2ee: { type: boolean }
        sender_key_id: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }

    MessageSend:
      type: object
      required: [client_msg_id, type, body_ct]
      properties:
        client_msg_id: { type: string }
        type: { type: string, default: text }
        body_ct: { type: string }
        e2ee: { type: boolean }
        aad: { type: string }
        reply_to: { type: [string, 'null'] }

    Wallet:
      type: object
      properties:
        balances:
          type: array
          items:
            type: object
            properties:
              asset: { $ref: '#/components/schemas/Asset' }
              available: { type: string }
              locked: { type: string }
        deposit:
          type: object
          properties:
            asset: { $ref: '#/components/schemas/Asset' }
            address: { type: string }
            qr: { type: string }
            min: { type: string }
            confirmations_required: { type: integer }
        limits:
          type: object
          properties:
            withdraw_daily_sol: { type: string }
            withdraw_single_sol: { type: string }
            withdraw_whitelist_cooling_h: { type: integer }

    Withdrawal:
      type: object
      properties:
        id: { type: string }
        status:
          type: string
          enum: [pending_2fa, pending_approval, approved, broadcast, confirmed, failed, cancelled]
        amount: { type: string }
        asset: { $ref: '#/components/schemas/Asset' }
        dest_address: { type: string }
        fee: { type: string }
        signature: { type: [string, 'null'] }
        eta_s: { type: integer }

    Quote:
      type: object
      properties:
        quote_id: { type: string }
        rate: { type: string }
        fee_bps: { type: integer }
        from_amount: { type: string }
        to_amount: { type: string }
        valid_until: { type: string, format: date-time }

    ExchangeOrder:
      type: object
      properties:
        order_id: { type: string }
        status: { type: string, enum: [filled, failed, cancelled] }
        from: { type: string }
        to: { type: string }
        tx_id: { type: string }

    Gift:
      type: object
      properties:
        id: { type: string }
        sku: { type: string }
        title_ru: { type: string }
        description: { type: string }
        rarity: { type: string, enum: [common, rare, epic, legendary] }
        media_url: { type: [string, 'null'] }
        media_kind: { type: [string, 'null'], enum: [image, video, lottie, sticker, null] }
        price_stars: { type: integer }
        price_sol: { type: string }
        boosts_shop: { type: boolean }
        boost_days: { type: integer }
        per_user_limit: { type: [integer, 'null'] }
        status: { type: string, enum: [draft, published, archived] }

    GiftAdmin:
      type: object
      required: [sku, title_ru, rarity, totp_code]
      properties:
        sku: { type: string }
        title_ru: { type: string }
        title_en: { type: string }
        description: { type: string }
        rarity: { type: string, enum: [common, rare, epic, legendary] }
        media_b64: { type: string }
        media_kind: { type: string, enum: [image, video, lottie, sticker] }
        price_stars: { type: integer }
        price_sol: { type: string }
        per_user_limit: { type: integer }
        boosts_shop: { type: boolean }
        boost_value: { type: number }
        boost_days: { type: integer }
        collectible: { type: boolean }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        status: { type: string, enum: [draft, published, archived] }
        sort: { type: integer }
        totp_code: { type: string, pattern: '^[0-9]{6}$' }

    GiftBuy:
      type: object
      required: [asset, recipient_type]
      properties:
        asset: { $ref: '#/components/schemas/Asset' }
        recipient_type: { type: string, enum: [self, user, shop] }
        recipient_id: { type: [string, 'null'] }
        message: { type: string, maxLength: 200 }
        totp_code: { type: string }

    GiftPurchase:
      type: object
      properties:
        purchase_id: { type: string }
        status: { type: string, enum: [pending, paid, refunded, revoked] }
        charged:
          type: object
          properties:
            asset: { $ref: '#/components/schemas/Asset' }
            amount: { type: string }
        boost:
          type: object
          properties:
            shop_id: { type: string }
            until: { type: string, format: date-time }
            value: { type: number }
        gift: { $ref: '#/components/schemas/Gift' }

    ReviewCreate:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        rating_delivery: { type: integer, minimum: 1, maximum: 5 }
        rating_description: { type: integer, minimum: 1, maximum: 5 }
        rating_support: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, maxLength: 1000 }
        media: { type: array, items: { type: string }, maxItems: 3 }

    Review:
      type: object
      properties:
        id: { type: string }
        shop_id: { type: string }
        author: { type: string, description: Псевдоним автора }
        rating: { type: integer }
        body: { type: string }
        is_verified_purchase: { type: boolean }
        shop_reply: { type: [string, 'null'] }
        helpful_count: { type: integer }
        created_at: { type: string, format: date-time }

    AdminDashboard:
      type: object
      properties:
        gmv_sol: { type: string }
        gmv_stars: { type: integer }
        fees_sol: { type: string }
        users_total: { type: integer }
        users_new_24h: { type: integer }
        shops_active: { type: integer }
        rents_active: { type: integer }
        rents_mrr_sol: { type: string }
        disputes_open: { type: integer }
        disputes_sla_breach: { type: integer }
        orders_24h: { type: integer }
        security_incidents_24h: { type: integer }
        ledger_ok: { type: boolean }
