<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1115" />
  <title>SITEE — маркетплейс цифровых товаров на Solana</title>
  <meta name="description" content="SITEE: магазины цифровых товаров, аренда мест, эскроу в SOL и Telegram Stars, мессенджер с админом, споры с арбитром, двойной 2FA." />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app" class="app">
    <!-- Шапка: логотип слева, поиск по магазинам + «Найти» (FR-FEED-01) -->
    <header class="topbar" id="topbar">
      <a class="brand" href="#/shops" aria-label="SITEE — на главную">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8e7cff"/><stop offset="1" stop-color="#4b3fd6"/></linearGradient></defs>
            <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#bg1)"/>
            <path d="M8 11.5h16l-4 4.5 4 4.5H8l4-4.5z" fill="#fff" opacity=".95"/>
          </svg>
        </span>
        <span class="brand__text">SITEE</span>
      </a>
      <form class="search" id="search-form" role="search" autocomplete="off">
        <input id="search-input" class="search__input" type="search" placeholder="Поиск по магазинам" aria-label="Поиск по магазинам" />
        <button class="search__btn" type="submit">Найти</button>
      </form>
      <button class="icon-btn" id="bell-btn" type="button" aria-label="Уведомления" title="Уведомления">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 22a2.4 2.4 0 0 0 2.4-2.4H9.6A2.4 2.4 0 0 0 12 22Zm7-6.2-1.5-1.8V9.6a5.5 5.5 0 0 0-4-5.3V3.6a1.5 1.5 0 0 0-3 0v.7a5.5 5.5 0 0 0-4 5.3V14L5 15.8v1.1h14Z"/></svg>
        <span class="badge" id="bell-badge" hidden>0</span>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="splash"><div class="spinner"></div><p>Загружаем SITEE…</p></div>
    </main>

    <!-- Нижняя панель в стиле Telegram: 4 раздела (FR-NAV-01) -->
    <nav class="tabbar" id="tabbar" aria-label="Основная навигация">
      <a class="tab" href="#/shops" data-tab="shops">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 4h16l1.2 5.2a3 3 0 0 1-2.9 3.8h-.3a3 3 0 0 1-2.8-2 3 3 0 0 1-2.8 2 3 3 0 0 1-2.8-2 3 3 0 0 1-2.8 2H4.7A3 3 0 0 1 1.8 9.2Zm1.4 11h13.2v4.2a1.8 1.8 0 0 1-1.8 1.8H7.2a1.8 1.8 0 0 1-1.8-1.8Z"/></svg>
        <span>Магазины</span>
      </a>
      <a class="tab" href="#/chats" data-tab="chats">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 3C6.9 3 3 6.4 3 10.6c0 2.4 1.3 4.5 3.3 6L5.5 21l4-2.1c.8.2 1.6.3 2.5.3 5.1 0 9-3.4 9-7.6S17.1 3 12 3Zm-4 9a1.3 1.3 0 1 1 0-2.6A1.3 1.3 0 0 1 8 12Zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/></svg>
        <span>Чаты</span>
        <em class="tab__badge" id="tab-chats-badge" hidden>0</em>
      </a>
      <a class="tab" href="#/exchange" data-tab="exchange">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 4h2v3h5a4 4 0 0 1 0 8h-1.2l2.7 2.7L18.2 15H19a5.5 5.5 0 0 0 0-11H9V2L4.5 5.5 9 9V4Zm2 8h5a2 2 0 1 0 0-4H9v4Zm-4 3h1.2L3.5 12.3 6.2 15H5a2 2 0 0 0 0 4h4v2l4.5-3.5L9 14v3H5a1 1 0 0 1 0-2Z"/></svg>
        <span>Обмен</span>
      </a>
      <a class="tab" href="#/profile" data-tab="profile">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0-4.5-4.5A4.5 4.5 0 0 0 12 12Zm0 2c-4 0-7.5 2.2-7.5 5v2h15v-2c0-2.8-3.5-5-7.5-5Z"/></svg>
        <span>Профиль</span>
      </a>
    </nav>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div class="modal-root" id="modal-root" hidden></div>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
